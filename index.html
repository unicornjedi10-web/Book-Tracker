<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Book Tracker</title>

<style>
/* Your existing styles (same as before) */
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f6f6f6;
  display: flex;
  justify-content: center;
  padding: 20px;
  transition: background 0.3s, color 0.3s;
}
body.dark { background: #1e1e1e; color: #f1f1f1; }

/* ... rest of your styles (progress bar, buttons, etc.) ... */

.modal {
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
}
.modal-content {
  background: white; padding: 20px; border-radius:12px;
}
</style>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<!-- LOGIN MODAL -->
<div id="authModal" class="modal">
  <div class="modal-content">
    <h3>Sign In / Register</h3>
    <input type="email" id="authEmail" placeholder="Email"><br><br>
    <input type="password" id="authPassword" placeholder="Password"><br><br>
    <button onclick="signUp()">Register</button>
    <button onclick="signIn()">Sign In</button>
  </div>
</div>

<!-- MAIN CARD (your existing UI) -->
<div class="card" id="mainUI" style="display:none;">
  <!-- Your existing tracker UI here, exactly as before -->
  <h2 id="bookTitleDisplay">📖 Book Tracker</h2>
  <select id="bookSelect"></select>
  <button onclick="addBook()" class="small">➕ New Book</button>
  
  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="bar"></div>
    <div class="emoji" id="emoji">📚</div>
  </div>

  <div id="percent">0%</div>
  <div id="pageCount" class="small">0 / 0 pages</div>

  <button class="big-button" onclick="addPage()">+</button>
  <button class="big-button" onclick="removePage()">-</button>
  <button class="big-button" onclick="resetProgress()">⟳</button>

  <div class="small" id="estimate"></div>

  <div class="toggle" onclick="toggleSettings()">⚙️ Settings</div>

  <div id="settings" class="hidden small">
    <!-- Same settings fields as before -->
  </div>

  <button onclick="signOut()">Sign Out</button>
</div>

<script>
// === FIREBASE CONFIG (paste your config here) ===
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTHDOMAIN",
  projectId: "YOUR_PROJECTID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_SENDER",
  appId: "YOUR_APPID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// === AUTH HANDLERS ===
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("authModal").style.display = "none";
    document.getElementById("mainUI").style.display = "block";
    loadFromCloud();
  } else {
    document.getElementById("authModal").style.display = "flex";
    document.getElementById("mainUI").style.display = "none";
  }
});

function signUp() {
  const email = document.getElementById("authEmail").value;
  const pass = document.getElementById("authPassword").value;
  auth.createUserWithEmailAndPassword(email, pass).catch(alert);
}

function signIn() {
  const email = document.getElementById("authEmail").value;
  const pass = document.getElementById("authPassword").value;
  auth.signInWithEmailAndPassword(email, pass).catch(alert);
}

function signOut() {
  auth.signOut();
}

// === CLOUD FUNCTIONS ===

function saveToCloud() {
  const user = auth.currentUser;
  if (!user) return;

  db.collection("bookData").doc(user.uid).set({ books })
    .catch(err => console.error("Cloud save failed:", err));
}

function loadFromCloud() {
  const user = auth.currentUser;
  if (!user) return;

  db.collection("bookData").doc(user.uid).get()
    .then(doc => {
      if (doc.exists) {
        books = doc.data().books || books;
        populateBookSelect();
        loadBook(currentBookIndex);
      }
    })
    .catch(err => console.error("Cloud load failed:", err));
}

// === YOUR EXISTING TRACKER CODE BELOW ===
// (Everything you already had for books, UI, update(), 
// addBook(), removePage(), resetProgress(), toggleSettings(), etc.)

// But everywhere you previously did saveBooks/localStorage:
function saveBooks() {
  localStorage.setItem("books", JSON.stringify(books));
  saveToCloud();  // ALSO save to cloud
}

// Everywhere you called localStorage stuff, just keep it
// and now we also sync to Firebase automatically

// Ensure update() calls saveBooks() after changes too

</script>

</body>
</html>
