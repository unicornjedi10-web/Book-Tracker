<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f6f6f6;
  display: flex;
  justify-content: center;
  padding: 20px;
  transition: background 0.3s, color 0.3s;
}

body.dark {
  background: #1e1e1e;
  color: #f1f1f1;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  width: 340px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.06);
  transition: background 0.3s, color 0.3s;
}

body.dark .card {
  background: #2b2b2b;
  color: #f1f1f1;
}

h2 {
  margin-bottom: 10px;
}

.progress-container {
  background: #eee;
  border-radius: 12px;
  height: 20px;
  overflow: hidden;
  margin: 15px 0;
  position: relative;
}

body.dark .progress-container {
  background: #444;
}

.progress-bar {
  height: 100%;
  width: 0%;
  transition: 0.4s ease;
  border-radius: 12px;
}

.emoji {
  position: absolute;
  top: -2px;
  transform: translateX(-50%);
  font-size: 20px;
  transition: left 0.4s ease;
}

.big-button {
  font-size: 26px;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  color: white;
  transition: 0.2s;
  margin: 5px;
}

.big-button:active {
  transform: scale(0.9);
}

.small {
  font-size: 13px;
  opacity: 0.7;
}

input {
  width: 70px;
  text-align: center;
  border-radius: 6px;
  border: 1px solid #ddd;
  margin: 4px;
}

.toggle {
  margin-top: 10px;
  cursor: pointer;
  font-size: 13px;
  opacity: 0.7;
}

.hidden {
  display: none;
}
</style>
</head>
<body>

<div class="card">
  <h2 id="bookTitleDisplay">📖 Book Tracker</h2>

  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="bar"></div>
    <div class="emoji" id="emoji">📚</div>
  </div>

  <div id="percent">0%</div>
  <div id="pageCount" class="small">0 / 0 pages</div>

  <button class="big-button" onclick="addPage()">+</button>
  <button class="big-button" onclick="removePage()">-</button>
  <button class="big-button" onclick="resetProgress()">⟳</button>

  <div class="small" id="estimate"></div>

  <div class="toggle" onclick="toggleSettings()">⚙️ Settings</div>

  <div id="settings" class="hidden small">
    Current Book: <input type="text" id="bookTitle"><br>
    Total Pages: <input type="number" id="total"><br>
    Daily Pages: <input type="number" id="daily"><br>
    Step Size: <input type="number" id="step"><br>
    Primary Color: <input type="color" id="color"><br>
    Settings / Remaining Color: <input type="color" id="secondaryColor"><br>
    Emoji: <input type="text" id="emojiInput" maxlength="2"><br>
    <button onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
  </div>
</div>

<script>
// Load saved state or defaults
let saved = JSON.parse(localStorage.getItem("bookTracker")) || {};
let read = saved.read || 0;
document.getElementById("bookTitle").value = saved.bookTitle || "";
document.getElementById("bookTitleDisplay").innerText = saved.bookTitle ? "📖 " + saved.bookTitle : "📖 Book Tracker";
document.getElementById("total").value = saved.total || 300;
document.getElementById("daily").value = saved.daily || 10;
document.getElementById("step").value = saved.step || 1;
document.getElementById("color").value = saved.color || "#4CAF50";
document.getElementById("secondaryColor").value = saved.secondaryColor || "#cccccc";
document.getElementById("emojiInput").value = saved.emoji || "📚";
document.getElementById("emoji").innerText = saved.emoji || "📚";
if(saved.darkMode) document.body.classList.add("dark");

function saveState() {
  let state = {
    read: read,
    bookTitle: document.getElementById("bookTitle").value,
    total: parseInt(document.getElementById("total").value),
    daily: parseInt(document.getElementById("daily").value),
    step: parseInt(document.getElementById("step").value),
    color: document.getElementById("color").value,
    secondaryColor: document.getElementById("secondaryColor").value,
    emoji: document.getElementById("emojiInput").value,
    darkMode: document.body.classList.contains("dark")
  };
  localStorage.setItem("bookTracker", JSON.stringify(state));
}

function addPage() {
  let step = parseInt(document.getElementById("step").value);
  read += step;
  update();
  saveState();
}

function removePage() {
  let step = parseInt(document.getElementById("step").value);
  read = Math.max(0, read - step);
  update();
  saveState();
}

function resetProgress() {
  read = 0;
  update();
  saveState();
}

function update() {
  let total = parseInt(document.getElementById("total").value);
  let daily = parseInt(document.getElementById("daily").value);
  let color = document.getElementById("color").value;
  let secondaryColor = document.getElementById("secondaryColor").value;
  let title = document.getElementById("bookTitle").value;
  let emojiChar = document.getElementById("emojiInput").value || "📚";

  let percent = Math.min((read / total) * 100, 100);

  // Progress bar: primary = completed, secondary = remaining
  document.getElementById("bar").style.background = `linear-gradient(to right, ${color} 0%, ${color} ${percent}%, ${secondaryColor} ${percent}%, ${secondaryColor} 100%)`;

  // Buttons use primary color
  document.querySelectorAll(".big-button").forEach(btn => btn.style.background = color);

  // Text elements use secondary color
  document.getElementById("percent").style.color = secondaryColor;
  document.getElementById("pageCount").style.color = secondaryColor;
  document.getElementById("estimate").style.color = secondaryColor;
  document.getElementById("bookTitleDisplay").style.color = secondaryColor;

  document.getElementById("percent").innerText = percent.toFixed(1) + "%";
  document.getElementById("pageCount").innerText = `${read} / ${total} pages`;

  let remaining = total - read;
  let days = Math.ceil(remaining / daily);
  let d = new Date();
  d.setDate(d.getDate() + days);

  document.getElementById("estimate").innerText =
    remaining > 0 ? "📅 Finish: " + d.toDateString() : "🎉 Completed!";

  document.getElementById("bookTitleDisplay").innerText = title ? "📖 " + title : "📖 Book Tracker";

  // Emoji moves along progress
  let containerWidth = document.getElementById("progressContainer").offsetWidth;
  let emojiPos = (percent / 100) * containerWidth;
  document.getElementById("emoji").style.left = `${emojiPos}px`;
  document.getElementById("emoji").innerText = emojiChar;
}

function toggleSettings() {
  document.getElementById("settings").classList.toggle("hidden");
}

function toggleDarkMode() {
  document.body.classList.toggle("dark");
  saveState();
}

// Update whenever inputs change
document.querySelectorAll("#bookTitle, #total, #daily, #step, #color, #secondaryColor, #emojiInput").forEach(input => {
  input.addEventListener("input", () => { update(); saveState(); });
});

update();
</script>

</body>
</html>
