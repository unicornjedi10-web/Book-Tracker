<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f6f6f6;
  display: flex;
  justify-content: center;
  padding: 20px;
  transition: background 0.3s, color 0.3s;
}
body.dark {
  background: #1e1e1e;
  color: #f1f1f1;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  width: 360px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.06);
  transition: background 0.3s, color 0.3s;
}
body.dark .card {
  background: #2b2b2b;
  color: #f1f1f1;
}
h2 {
  margin-bottom: 10px;
}
.progress-container {
  background: #eee;
  border-radius: 12px;
  height: 20px;
  overflow: hidden;
  margin: 15px 0;
  position: relative;
}
body.dark .progress-container {
  background: #444;
}
.progress-bar {
  height: 100%;
  width: 0%;
  border-radius: 12px;
  transition: width 0.4s ease;
}
.emoji {
  position: absolute;
  top: -2px;
  transform: translateX(-50%);
  font-size: 20px;
  transition: left 0.4s ease;
}
.big-button {
  font-size: 26px;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  color: white;
  transition: 0.2s;
  margin: 5px;
}
.big-button:active { transform: scale(0.9); }
.small { font-size: 13px; opacity: 0.7; }
input, select { width: 80px; text-align: center; border-radius: 6px; border: 1px solid #ddd; margin: 4px; }
.toggle { margin-top: 10px; cursor: pointer; font-size: 13px; opacity: 0.7; }
.hidden { display: none; }
</style>
</head>
<body>

<div class="card">
  <h2 id="bookTitleDisplay">📖 Book Tracker</h2>
  
  <select id="bookSelect"></select>
  <button onclick="addBook()" class="small">➕ New Book</button>
  
  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="bar"></div>
    <div class="emoji" id="emoji">📚</div>
  </div>
  
  <div id="percent">0%</div>
  <div id="pageCount" class="small">0 / 0 pages</div>
  
  <button class="big-button" onclick="addPage()">+</button>
  <button class="big-button" onclick="removePage()">-</button>
  <button class="big-button" onclick="resetProgress()">⟳</button>
  
  <div class="small" id="estimate"></div>
  
  <div class="toggle" onclick="toggleSettings()">⚙️ Settings</div>
  
  <div id="settings" class="hidden small">
    Title: <input type="text" id="bookTitle"><br>
    Total Pages: <input type="number" id="total"><br>
    Daily Pages: <input type="number" id="daily"><br>
    Step Size: <input type="number" id="step"><br>
    Primary Color: <input type="color" id="color"><br>
    Secondary Color: <input type="color" id="secondaryColor"><br>
    Emoji: <input type="text" id="emojiInput" maxlength="2"><br>
    <button onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button><br>
    <button onclick="exportToSheets()">📤 Export to Google Sheets</button>
  </div>
</div>

<script>
// --- Load or initialize ---
let books = JSON.parse(localStorage.getItem("books")) || [];
let currentBookIndex = 0;

// Initialize first book if none exist
if(books.length === 0) {
  books.push({
    title: "Book 1",
    read: 0,
    total: 300,
    daily: 10,
    step: 1,
    color: "#4CAF50",
    secondaryColor: "#cccccc",
    emoji: "📚"
  });
}
populateBookSelect();
loadBook(currentBookIndex);

// --- UI Functions ---
function populateBookSelect() {
  const sel = document.getElementById("bookSelect");
  sel.innerHTML = "";
  books.forEach((b, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.innerText = b.title;
    sel.appendChild(opt);
  });
  sel.value = currentBookIndex;
}

document.getElementById("bookSelect").addEventListener("change", (e) => {
  currentBookIndex = parseInt(e.target.value);
  loadBook(currentBookIndex);
});

function addBook() {
  let newBook = {
    title: `Book ${books.length+1}`,
    read: 0,
    total: 300,
    daily: 10,
    step: 1,
    color: "#4CAF50",
    secondaryColor: "#cccccc",
    emoji: "📚"
  };
  books.push(newBook);
  currentBookIndex = books.length-1;
  saveBooks();
  populateBookSelect();
  loadBook(currentBookIndex);
}

function loadBook(index) {
  let book = books[index];
  document.getElementById("bookTitle").value = book.title;
  document.getElementById("total").value = book.total;
  document.getElementById("daily").value = book.daily;
  document.getElementById("step").value = book.step;
  document.getElementById("color").value = book.color;
  document.getElementById("secondaryColor").value = book.secondaryColor;
  document.getElementById("emojiInput").value = book.emoji;
  update();
}

function saveBooks() {
  localStorage.setItem("books", JSON.stringify(books));
}

// --- Book Actions ---
function addPage() {
  let book = books[currentBookIndex];
  book.read += parseInt(document.getElementById("step").value);
  if(book.read > book.total) book.read = book.total;
  saveBookInputs();
  update();
  saveBooks();
}

function removePage() {
  let book = books[currentBookIndex];
  book.read -= parseInt(document.getElementById("step").value);
  if(book.read < 0) book.read = 0;
  saveBookInputs();
  update();
  saveBooks();
}

function resetProgress() {
  let book = books[currentBookIndex];
  book.read = 0;
  saveBookInputs();
  update();
  saveBooks();
}

// --- Update Display ---
function saveBookInputs() {
  let book = books[currentBookIndex];
  book.title = document.getElementById("bookTitle").value;
  book.total = parseInt(document.getElementById("total").value);
  book.daily = parseInt(document.getElementById("daily").value);
  book.step = parseInt(document.getElementById("step").value);
  book.color = document.getElementById("color").value;
  book.secondaryColor = document.getElementById("secondaryColor").value;
  book.emoji = document.getElementById("emojiInput").value || "📚";
  populateBookSelect();
}

function update() {
  let book = books[currentBookIndex];
  let percent = Math.min((book.read / book.total) * 100, 100);

  // Progress bar
  document.getElementById("bar").style.width = percent + "%";
  document.getElementById("bar").style.background = book.color;
  document.getElementById("progressContainer").style.background = book.secondaryColor;

  // Buttons color
  document.querySelectorAll(".big-button").forEach(btn => btn.style.background = book.color);

  // Text color
  document.getElementById("percent").style.color = book.secondaryColor;
  document.getElementById("pageCount").style.color = book.secondaryColor;
  document.getElementById("estimate").style.color = book.secondaryColor;
  document.getElementById("bookTitleDisplay").style.color = book.secondaryColor;

  // Text updates
  document.getElementById("percent").innerText = percent.toFixed(1) + "%";
  document.getElementById("pageCount").innerText = `${book.read} / ${book.total} pages`;
  document.getElementById("bookTitleDisplay").innerText = book.title ? "📖 " + book.title : "📖 Book Tracker";

  let remaining = book.total - book.read;
  let days = Math.ceil(remaining / book.daily);
  let d = new Date();
  d.setDate(d.getDate() + days);
  document.getElementById("estimate").innerText =
    remaining > 0 ? "📅 Finish: " + d.toDateString() : "🎉 Completed!";

  // Emoji
  let containerWidth = document.getElementById("progressContainer").offsetWidth;
  let emojiPos = (percent / 100) * containerWidth;
  document.getElementById("emoji").style.left = `${emojiPos}px`;
  document.getElementById("emoji").innerText = book.emoji;
}

// --- Toggle settings & dark mode ---
function toggleSettings() { document.getElementById("settings").classList.toggle("hidden"); }
function toggleDarkMode() { document.body.classList.toggle("dark"); saveBooks(); }

// --- Export to Google Sheets ---
// Set up your Google Apps Script endpoint URL
const SHEETS_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

function exportToSheets() {
  let data = books.map(b => ({
    title: b.title,
    read: b.read,
    total: b.total,
    daily: b.daily,
    step: b.step,
    color: b.color,
    secondaryColor: b.secondaryColor,
    emoji: b.emoji
  }));
  
  fetch(SHEETS_URL, {
    method: "POST",
    body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" }
  }).then(res => {
    if(res.ok) alert("Exported to Google Sheets!");
    else alert("Failed to export.");
  }).catch(err => alert("Error exporting: "+err));
}

// --- Save inputs whenever changed ---
document.querySelectorAll("#bookTitle, #total, #daily, #step, #color, #secondaryColor, #emojiInput").forEach(input => {
  input.addEventListener("input", () => { saveBookInputs(); update(); saveBooks(); });
});

update();
</script>

</body>
</html>
