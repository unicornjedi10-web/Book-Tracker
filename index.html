<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f6f6f6;
  display: flex;
  justify-content: center;
  padding: 20px;
  transition: background 0.3s, color 0.3s;
}

body.dark {
  background: #1e1e1e;
  color: #f1f1f1;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  width: 320px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.06);
  transition: background 0.3s, color 0.3s;
}

body.dark .card {
  background: #2b2b2b;
  color: #f1f1f1;
}

h2 {
  margin-bottom: 10px;
}

.progress-container {
  background: #eee;
  border-radius: 12px;
  height: 14px;
  overflow: hidden;
  margin: 15px 0;
}

body.dark .progress-container {
  background: #444;
}

.progress-bar {
  height: 100%;
  width: 0%;
  transition: 0.4s ease;
  background: #4CAF50;
}

.big-button {
  font-size: 26px;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: none;
  background: #4CAF50;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

.big-button:active {
  transform: scale(0.9);
}

.small {
  font-size: 13px;
  opacity: 0.7;
}

input {
  width: 70px;
  text-align: center;
  border-radius: 6px;
  border: 1px solid #ddd;
  margin: 4px;
}

.toggle {
  margin-top: 10px;
  cursor: pointer;
  font-size: 13px;
  opacity: 0.7;
}

.hidden {
  display: none;
}
</style>
</head>
<body>

<div class="card">
  <h2 id="bookTitleDisplay">📖 Book Tracker</h2>

  <div class="progress-container">
    <div class="progress-bar" id="bar"></div>
  </div>

  <div id="percent">0%</div>

  <button class="big-button" onclick="addPage()">+</button>

  <div class="small" id="estimate"></div>

  <div class="toggle" onclick="toggleSettings()">⚙️ Settings</div>

  <div id="settings" class="hidden small">
    Current Book: <input type="text" id="bookTitle"><br>
    Total Pages: <input type="number" id="total"><br>
    Daily Pages: <input type="number" id="daily"><br>
    Step Size: <input type="number" id="step"><br>
    Color: <input type="color" id="color"><br>
    <button onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
  </div>
</div>

<script>
// Load saved state or defaults
let saved = JSON.parse(localStorage.getItem("bookTracker")) || {};
let read = saved.read || 0;
document.getElementById("bookTitle").value = saved.bookTitle || "";
document.getElementById("bookTitleDisplay").innerText = saved.bookTitle ? "📖 " + saved.bookTitle : "📖 Book Tracker";
document.getElementById("total").value = saved.total || 300;
document.getElementById("daily").value = saved.daily || 10;
document.getElementById("step").value = saved.step || 1;
document.getElementById("color").value = saved.color || "#4CAF50";
if(saved.darkMode) document.body.classList.add("dark");

function saveState() {
  let state = {
    read: read,
    bookTitle: document.getElementById("bookTitle").value,
    total: parseInt(document.getElementById("total").value),
    daily: parseInt(document.getElementById("daily").value),
    step: parseInt(document.getElementById("step").value),
    color: document.getElementById("color").value,
    darkMode: document.body.classList.contains("dark")
  };
  localStorage.setItem("bookTracker", JSON.stringify(state));
}

function addPage() {
  let step = parseInt(document.getElementById("step").value);
  read += step;
  update();
  saveState();
}

function update() {
  let total = parseInt(document.getElementById("total").value);
  let daily = parseInt(document.getElementById("daily").value);
  let color = document.getElementById("color").value;
  let title = document.getElementById("bookTitle").value;

  let percent = Math.min((read / total) * 100, 100);

  document.getElementById("bar").style.width = percent + "%";
  document.getElementById("bar").style.background = color;
  document.querySelector(".big-button").style.background = color;

  document.getElementById("percent").innerText = percent.toFixed(1) + "%";

  let remaining = total - read;
  let days = Math.ceil(remaining / daily);
  let d = new Date();
  d.setDate(d.getDate() + days);

  document.getElementById("estimate").innerText =
    remaining > 0 ? "📅 Finish: " + d.toDateString() : "🎉 Completed!";

  // Update displayed title
  document.getElementById("bookTitleDisplay").innerText = title ? "📖 " + title : "📖 Book Tracker";
}

function toggleSettings() {
  document.getElementById("settings").classList.toggle("hidden");
}

function toggleDarkMode() {
  document.body.classList.toggle("dark");
  saveState();
}

// Update whenever inputs change
document.querySelectorAll("#bookTitle, #total, #daily, #step, #color").forEach(input => {
  input.addEventListener("input", () => { update(); saveState(); });
});

update();
</script>

</body>
</html>
